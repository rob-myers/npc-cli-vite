<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5aa0f0"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
  </defs>
  <rect width="760" height="470" rx="10" fill="#1b1d22"/>
  <text x="24" y="30" fill="#e6e6e6" font-size="15" font-weight="600">heldUp: whom a slowed walker W is held up by</text>

  <!-- behind W, within the near circle -->
  <path d="M300,118 A112,112 0 0 0 300,342 Z" fill="#ffffff" opacity="0.05"/>
  <text x="196" y="360" fill="#9aa0a6">behind W (2)</text>

  <!-- the path and its band: both radii + 0.1m -->
  <rect x="300" y="150" width="420" height="160" rx="12" fill="#5aa0f0" fill-opacity="0.16"/>
  <line x1="300" y1="230" x2="716" y2="230" stroke="#5aa0f0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="560" y="134" fill="#5aa0f0">path ± 0.5m (3)</text>
  <text x="560" y="328" fill="#5aa0f0" font-size="12">both radii + pathMargin</text>

  <!-- near: the crowd's neighbours within 0.7m -->
  <circle cx="300" cy="230" r="112" fill="none" stroke="#7a8290" stroke-width="1.5" stroke-dasharray="7 5"/>
  <line x1="300" y1="230" x2="379" y2="309" stroke="#9aa0a6" marker-end="url(#dim)"/>
  <text x="388" y="324" fill="#9aa0a6">0.7m</text>
  <text x="250" y="104" fill="#9aa0a6">near (1)</text>

  <!-- npcs: radius 0.2m -->
  <circle cx="300" cy="230" r="32" fill="#5aa0f0"/>
  <text x="300" y="235" fill="#10131a" font-weight="700" text-anchor="middle">W</text>

  <circle cx="380" cy="230" r="32" fill="#4ec98a"/>
  <text x="380" y="235" fill="#10131a" font-weight="700" text-anchor="middle">N1</text>

  <circle cx="234" cy="268" r="32" fill="#8a8f98"/>
  <text x="234" y="273" fill="#10131a" font-weight="700" text-anchor="middle">N2</text>

  <circle cx="332" cy="134" r="32" fill="#e0b050"/>
  <text x="332" y="139" fill="#10131a" font-weight="700" text-anchor="middle">N3</text>

  <circle cx="480" cy="230" r="32" fill="#e06c6c" fill-opacity="0.85"/>
  <text x="480" y="235" fill="#10131a" font-weight="700" text-anchor="middle">N4</text>

  <!-- slowed -->
  <rect x="40" y="70" width="150" height="10" rx="5" fill="#262a31" stroke="#3a404a"/>
  <rect x="40" y="70" width="45" height="10" rx="5" fill="#5aa0f0"/>
  <line x1="115" y1="64" x2="115" y2="86" stroke="#e6e6e6" stroke-width="1.5"/>
  <text x="40" y="100" fill="#9aa0a6" font-size="12">W's speed, below half</text>
  <text x="40" y="116" fill="#9aa0a6" font-size="12">its top for 0.05s (5)</text>

  <!-- scale -->
  <line x1="40" y1="160" x2="200" y2="160" stroke="#9aa0a6" stroke-width="2"/>
  <line x1="40" y1="154" x2="40" y2="166" stroke="#9aa0a6" stroke-width="2"/>
  <line x1="200" y1="154" x2="200" y2="166" stroke="#9aa0a6" stroke-width="2"/>
  <text x="120" y="148" fill="#9aa0a6" text-anchor="middle">1m</text>

  <!-- legend -->
  <g font-size="13">
    <circle cx="34" cy="398" r="6" fill="#4ec98a"/>
    <text x="48" y="403" fill="#e6e6e6">N1 held up: near, ahead, their bodies meet, W slowed. Asked to make way</text>
    <circle cx="34" cy="420" r="6" fill="#8a8f98"/>
    <text x="48" y="425" fill="#e6e6e6">N2 fails 2 (ahead): behind W, said as "rob passed by kate"</text>
    <circle cx="34" cy="442" r="6" fill="#e0b050"/>
    <text x="48" y="447" fill="#e6e6e6">N3 fails 3 (on their way): over 0.5m off the path, "kate clear of rob"</text>
    <circle cx="520" cy="442" r="6" fill="#e06c6c"/>
    <text x="534" y="447" fill="#e6e6e6">N4 fails 1: not near</text>
  </g>
</svg>
