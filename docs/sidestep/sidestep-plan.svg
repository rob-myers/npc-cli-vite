<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 667" width="760" height="667" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
<defs><marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8290"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e06c6c"/></marker><marker id="yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d8b46a"/></marker></defs>
<rect width="760" height="667" rx="10" fill="#1b1d22"/>
<text x="24" y="32" fill="#e6e6e6" font-size="15" font-weight="600">plan: the worker plans the kind asked (worker/sidestep.ts, planSidestep)</text>
<rect x="60" y="56" width="400" height="58" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="75" fill="#e6e6e6" font-weight="600">the ground</text>
<text x="76" y="92" fill="#9aa0a6" font-size="12">way: the walker&#x27;s heading. across: square to it,</text>
<text x="76" y="107" fill="#9aa0a6" font-size="12">toward the npc. walls within 5m. width across way</text>
<line x1="260.0" y1="114" x2="260.0" y2="130" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="132" width="400" height="58" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="151" fill="#e6e6e6" font-weight="600">find the kind&#x27;s step</text>
<text x="76" y="168" fill="#9aa0a6" font-size="12">the kind and its tuning from the hud&#x27;s debug item,</text>
<text x="76" y="183" fill="#9aa0a6" font-size="12">slid along the navmesh</text>
<line x1="460" y1="155.0" x2="518" y2="155.0" stroke="#e06c6c" stroke-width="1.5" marker-end="url(#red)"/>
<rect x="524" y="143.0" width="212" height="24" rx="12" fill="#3a2426"/>
<text x="536" y="159.0" fill="#f0a0a0" font-size="12">no room: they stay put</text>
<line x1="260.0" y1="190" x2="260.0" y2="206" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="208" width="400" height="43" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="227" fill="#e6e6e6" font-weight="600">moves somewhere?</text>
<text x="76" y="244" fill="#9aa0a6" font-size="12">at least 0.2m (0.1m for turn). stand never moves</text>
<line x1="460" y1="229.5" x2="518" y2="229.5" stroke="#e06c6c" stroke-width="1.5" marker-end="url(#red)"/>
<rect x="524" y="217.5" width="212" height="24" rx="12" fill="#3a2426"/>
<text x="536" y="233.5" fill="#f0a0a0" font-size="12">no: they stay put</text>
<line x1="260.0" y1="251" x2="260.0" y2="267" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="269" width="400" height="43" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="288" fill="#e6e6e6" font-weight="600">a route there?</text>
<text x="76" y="305" fill="#9aa0a6" font-size="12">the navmesh route the crowd would walk (pathTo)</text>
<line x1="460" y1="290.5" x2="518" y2="290.5" stroke="#e06c6c" stroke-width="1.5" marker-end="url(#red)"/>
<rect x="524" y="278.5" width="212" height="24" rx="12" fill="#3a2426"/>
<text x="536" y="294.5" fill="#f0a0a0" font-size="12">no route: stay put</text>
<line x1="260.0" y1="312" x2="260.0" y2="328" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="330" width="400" height="58" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="349" fill="#e6e6e6" font-weight="600">clear of the walker?</text>
<text x="76" y="366" fill="#9aa0a6" font-size="12">each 0.1m keeps 0.6m from them, as they come</text>
<text x="76" y="381" fill="#9aa0a6" font-size="12">0.5m on. Already nearer: comes no nearer</text>
<line x1="460" y1="353.0" x2="518" y2="353.0" stroke="#e06c6c" stroke-width="1.5" marker-end="url(#red)"/>
<rect x="524" y="341.0" width="212" height="24" rx="12" fill="#3a2426"/>
<text x="536" y="357.0" fill="#f0a0a0" font-size="12">passes rob: stay put</text>
<line x1="260.0" y1="388" x2="260.0" y2="404" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="406" width="400" height="58" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="425" fill="#e6e6e6" font-weight="600">ends clear?</text>
<text x="76" y="442" fill="#9aa0a6" font-size="12">at least 0.6m from the walker, or 0.15m further</text>
<text x="76" y="457" fill="#9aa0a6" font-size="12">from them than they stood</text>
<line x1="460" y1="429.0" x2="518" y2="429.0" stroke="#e06c6c" stroke-width="1.5" marker-end="url(#red)"/>
<rect x="524" y="417.0" width="212" height="24" rx="12" fill="#3a2426"/>
<text x="536" y="433.0" fill="#f0a0a0" font-size="12">ends near: stay put</text>
<line x1="260.0" y1="464" x2="260.0" y2="480" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="482" width="400" height="43" rx="22" fill="#1f3a2c" stroke="#4ec98a"/>
<text x="76" y="501" fill="#4ec98a" font-weight="600">take it</text>
<text x="76" y="518" fill="#9aa0a6" font-size="12">the step, its reason, the route drawn</text>
<text x="24" y="547" fill="#9aa0a6" font-size="12">Staying put, --debug says why in red: kate didn&#x27;t avoid rob: wall, held up, against the wall.</text>
<text x="24" y="563" fill="#9aa0a6" font-size="12">The walker&#x27;s path is carried on 2m along their way, so a spot further along their line isn&#x27;t clear.</text>
<text x="24" y="579" fill="#9aa0a6" font-size="12">aside: a clear spot within 2m, not within 45° of the way ahead, else 0.8m across.</text>
<text x="24" y="595" fill="#9aa0a6" font-size="12">turn: a 0.2m half-step, turned side-on.   shuffle: a 0.3m shuffle across.   wall: an edge within 1m.</text>
<text x="24" y="611" fill="#9aa0a6" font-size="12">doorway: an open door within 2m, 0.5m through.   back: in a way under 1.4m wide, on to where it is 2m.</text>
<text x="24" y="627" fill="#9aa0a6" font-size="12">stand: they hold their ground.   Collapsed and dragged: they scoot along a wall, whatever the kind.</text>
<text x="24" y="643" fill="#9aa0a6" font-size="12">Each limit is tuned per kind in the hud&#x27;s debug item, or by jsh, e.g. sidestep kind:wall reach:2.</text>
</svg>
