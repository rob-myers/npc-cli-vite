<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 724" width="760" height="724" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
<defs><marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a8290"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e06c6c"/></marker><marker id="yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d8b46a"/></marker></defs>
<rect width="760" height="724" rx="10" fill="#1b1d22"/>
<text x="24" y="32" fill="#e6e6e6" font-size="15" font-weight="600">makeWay: one npc making way, asynchronously</text>
<rect x="60" y="56" width="400" height="43" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="75" fill="#e6e6e6" font-weight="600">mark stepping</text>
<text x="76" y="92" fill="#9aa0a6" font-size="12">the lookout passes them by until it&#x27;s over</text>
<line x1="260.0" y1="99" x2="260.0" y2="115" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="117" width="400" height="58" rx="8" fill="#1f2d42" stroke="#5aa0f0"/>
<text x="76" y="136" fill="#8cc0ff" font-weight="600">ask the worker: op sidestep</text>
<text x="76" y="153" fill="#9aa0a6" font-size="12">the kind from the hud, the npc, the walker&#x27;s path</text>
<text x="76" y="168" fill="#9aa0a6" font-size="12">and heading, and others near: see plan</text>
<line x1="260.0" y1="175" x2="260.0" y2="191" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="193" width="400" height="58" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="212" fill="#e6e6e6" font-weight="600">emit</text>
<text x="76" y="229" fill="#9aa0a6" font-size="12">the choice as a sidestep event, for --debug.</text>
<text x="76" y="244" fill="#9aa0a6" font-size="12">No step: stand, or no room for the kind</text>
<line x1="460" y1="216.0" x2="518" y2="216.0" stroke="#d8b46a" stroke-width="1.5" marker-end="url(#yellow)"/>
<rect x="524" y="204.0" width="212" height="24" rx="12" fill="#2a2618"/>
<text x="536" y="220.0" fill="#e8c880" font-size="12">no step: done</text>
<line x1="260.0" y1="251" x2="260.0" y2="267" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="269" width="400" height="43" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="288" fill="#e6e6e6" font-weight="600">react</text>
<text x="76" y="305" fill="#9aa0a6" font-size="12">wait 0.05 … 0.15s of game time (reactSecs)</text>
<line x1="260.0" y1="312" x2="260.0" y2="328" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="330" width="400" height="43" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="349" fill="#e6e6e6" font-weight="600">still free?</text>
<text x="76" y="366" fill="#9aa0a6" font-size="12">whyNot again: they may have moved or turned</text>
<line x1="460" y1="351.5" x2="518" y2="351.5" stroke="#e06c6c" stroke-width="1.5" marker-end="url(#red)"/>
<rect x="524" y="339.5" width="212" height="24" rx="12" fill="#3a2426"/>
<text x="536" y="355.5" fill="#f0a0a0" font-size="12">not free: done</text>
<line x1="260.0" y1="373" x2="260.0" y2="389" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="391" width="400" height="58" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="410" fill="#e6e6e6" font-weight="600">note home</text>
<text x="76" y="427" fill="#9aa0a6" font-size="12">unless back is stay: where they stand, or the</text>
<text x="76" y="442" fill="#9aa0a6" font-size="12">home already kept from an earlier step</text>
<line x1="260.0" y1="449" x2="260.0" y2="465" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="467" width="400" height="58" rx="8" fill="#1f3a2c" stroke="#4ec98a"/>
<text x="76" y="486" fill="#4ec98a" font-weight="600">perform</text>
<text x="76" y="503" fill="#9aa0a6" font-size="12">strafe to via, then to, facing the walker (shove)</text>
<text x="76" y="518" fill="#9aa0a6" font-size="12">then look the way the choice faces</text>
<line x1="460" y1="490.0" x2="518" y2="490.0" stroke="#e06c6c" stroke-width="1.5" marker-end="url(#red)"/>
<rect x="524" y="478.0" width="212" height="24" rx="12" fill="#3a2426"/>
<text x="536" y="494.0" fill="#f0a0a0" font-size="12">cut short: a red event</text>
<line x1="260.0" y1="525" x2="260.0" y2="541" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="543" width="400" height="58" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="562" fill="#e6e6e6" font-weight="600">after the step</text>
<text x="76" y="579" fill="#9aa0a6" font-size="12">home&#x27;s last = where they stopped, steps + 1</text>
<text x="76" y="594" fill="#9aa0a6" font-size="12">settle only 0.3s before making way again</text>
<line x1="260.0" y1="601" x2="260.0" y2="617" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="619" width="400" height="43" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="638" fill="#e6e6e6" font-weight="600">finally</text>
<text x="76" y="655" fill="#9aa0a6" font-size="12">no longer stepping</text>
<text x="24" y="684" fill="#9aa0a6" font-size="12">Cut short by stuck, it still counts as their step: where they stopped is last.</text>
<text x="24" y="700" fill="#9aa0a6" font-size="12">Cut short by another move (move again), last is left, so that move pushing them off forgets home.</text>
</svg>
