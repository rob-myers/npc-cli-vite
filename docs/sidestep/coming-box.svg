<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5aa0f0"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/>
    </marker>
  </defs>
  <rect width="760" height="470" rx="10" fill="#1b1d22"/>
  <text x="24" y="30" fill="#e6e6e6" font-size="15" font-weight="600">coming: which npcs the walker W is coming at</text>

  <!-- behind W, within the box -->
  <rect x="230" y="70" width="150" height="300" fill="#ffffff" opacity="0.05"/>
  <text x="242" y="358" fill="#9aa0a6">behind W (4)</text>

  <!-- the box -->
  <rect x="230" y="70" width="300" height="300" fill="none" stroke="#7a8290" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="400" y="358" fill="#9aa0a6">box (3)</text>

  <!-- reach -->
  <line x1="382" y1="56" x2="528" y2="56" stroke="#9aa0a6" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="455" y="49" fill="#9aa0a6" text-anchor="middle">reach</text>

  <!-- the path and its course band -->
  <polyline points="380,220 620,220 700,140" fill="none" stroke="#5aa0f0" stroke-opacity="0.16" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="380,220 620,220 700,140" fill="none" stroke="#5aa0f0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="620" cy="220" r="4" fill="#5aa0f0"/>
  <text x="628" y="268" fill="#5aa0f0">corner</text>
  <text x="560" y="118" fill="#5aa0f0">path ± 0.3m (6)</text>

  <!-- npcs: radius 0.2m -->
  <circle cx="380" cy="220" r="20" fill="#5aa0f0"/>
  <text x="380" y="225" fill="#10131a" font-weight="700" text-anchor="middle">W</text>

  <circle cx="490" cy="220" r="20" fill="#4ec98a"/>
  <text x="490" y="225" fill="#10131a" font-weight="700" text-anchor="middle">N2</text>
  <text x="490" y="182" fill="#4ec98a" text-anchor="middle" font-weight="600">coming</text>

  <circle cx="465" cy="120" r="20" fill="#e0b050"/>
  <text x="465" y="125" fill="#10131a" font-weight="700" text-anchor="middle">N3</text>

  <circle cx="295" cy="285" r="20" fill="#8a8f98"/>
  <text x="295" y="290" fill="#10131a" font-weight="700" text-anchor="middle">N1</text>

  <circle cx="640" cy="335" r="20" fill="#e06c6c"/>
  <text x="640" y="340" fill="#10131a" font-weight="700" text-anchor="middle">N4</text>

  <!-- scale -->
  <line x1="40" y1="110" x2="143" y2="110" stroke="#9aa0a6" stroke-width="2"/>
  <line x1="40" y1="104" x2="40" y2="116" stroke="#9aa0a6" stroke-width="2"/>
  <line x1="143" y1="104" x2="143" y2="116" stroke="#9aa0a6" stroke-width="2"/>
  <text x="91" y="98" fill="#9aa0a6" text-anchor="middle">1m</text>

  <!-- legend -->
  <g font-size="13">
    <circle cx="34" cy="398" r="6" fill="#4ec98a"/>
    <text x="48" y="403" fill="#e6e6e6">N2 passes: ahead, within 0.3m of the path, reached within 0.7s. Yielded as coming</text>
    <circle cx="34" cy="420" r="6" fill="#e0b050"/>
    <text x="48" y="425" fill="#e6e6e6">N3 fails 6 (course): ahead, but over 0.3m off the path, so their bodies won't meet</text>
    <circle cx="34" cy="442" r="6" fill="#8a8f98"/>
    <text x="48" y="447" fill="#e6e6e6">N1 fails 4 (ahead): behind W's heading, so falling away</text>
    <circle cx="420" cy="442" r="6" fill="#e06c6c"/>
    <text x="434" y="447" fill="#e6e6e6">N4 fails 3 (box): outside it</text>
  </g>
  <text x="24" y="185" fill="#9aa0a6" font-size="12">reach =</text>
  <text x="24" y="201" fill="#9aa0a6" font-size="12">speed × 0.7s</text>
  <text x="24" y="217" fill="#9aa0a6" font-size="12">+ 2 × radius</text>
  <text x="24" y="241" fill="#9aa0a6" font-size="12">walking 1.5 m/s:</text>
  <text x="24" y="257" fill="#9aa0a6" font-size="12">1.05 + 0.4</text>
  <text x="24" y="273" fill="#9aa0a6" font-size="12">= 1.45m</text>
</svg>
