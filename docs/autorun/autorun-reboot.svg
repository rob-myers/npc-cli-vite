<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
<defs>
<marker id="right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8290"/></marker>
<marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8290"/></marker>
</defs>
<rect width="760" height="330" rx="10" fill="#1b1d22"/>
<text x="24" y="32" fill="#e6e6e6" font-size="15" font-weight="600">reboot: three steps, in every tty it acts on at once</text>

<!-- which ttys -->
<rect x="24" y="50" width="712" height="52" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="40" y="71" fill="#e6e6e6" font-weight="600">which ttys</text>
<text x="40" y="88" fill="#9aa0a6" font-size="12">those on this World (WORLD_KEY) running a process with the ptag WORLD, which every jsh/world process has</text>

<line x1="134" y1="102" x2="134" y2="122" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>

<!-- step 1 -->
<rect x="24" y="124" width="220" height="104" rx="8" fill="#3a2020" stroke="#e06c6c"/>
<text x="40" y="146" fill="#f09a9a" font-weight="600">1. killing jobs</text>
<text x="40" y="166" fill="#9aa0a6" font-size="12">the foreground job, if any,</text>
<text x="40" y="181" fill="#9aa0a6" font-size="12">as ctrl-c does</text>
<text x="40" y="201" fill="#9aa0a6" font-size="12">every job with a WORLD</text>
<text x="40" y="216" fill="#9aa0a6" font-size="12">process, as the Jobs panel's x</text>

<line x1="244" y1="176" x2="268" y2="176" stroke="#7a8290" stroke-width="1.5" marker-end="url(#right)"/>

<!-- step 2 -->
<rect x="270" y="124" width="220" height="104" rx="8" fill="#1f2d42" stroke="#5aa0f0"/>
<text x="286" y="146" fill="#8cc0ff" font-weight="600">2. running profiles</text>
<text x="286" y="166" fill="#9aa0a6" font-size="12">once the prompt is back,</text>
<text x="286" y="181" fill="#9aa0a6" font-size="12">runProfile again</text>
<text x="286" y="201" fill="#9aa0a6" font-size="12">awaitWorld makes a fresh pause</text>
<text x="286" y="216" fill="#9aa0a6" font-size="12">group, listeners join the World</text>

<line x1="490" y1="176" x2="514" y2="176" stroke="#7a8290" stroke-width="1.5" marker-end="url(#right)"/>

<!-- step 3 -->
<rect x="516" y="124" width="220" height="104" rx="8" fill="#1d3329" stroke="#4ec98a"/>
<text x="532" y="146" fill="#7fe0ad" font-weight="600">3. autorun</text>
<text x="532" y="166" fill="#9aa0a6" font-size="12">runPrelude, if the switch</text>
<text x="532" y="181" fill="#9aa0a6" font-size="12">is on</text>
<text x="532" y="201" fill="#9aa0a6" font-size="12">nothing it ran is running,</text>
<text x="532" y="216" fill="#9aa0a6" font-size="12">so each starts afresh</text>

<!-- each step -->
<rect x="24" y="246" width="712" height="62" rx="8" fill="#22252b" stroke="#3a404a" stroke-dasharray="4 3"/>
<text x="40" y="267" fill="#e6e6e6" font-weight="600">each step</text>
<text x="40" y="284" fill="#9aa0a6" font-size="12">is shown in the pill with a spinner, and written to each tty, e.g. <tspan font-family="ui-monospace, monospace">reboot killing jobs</tspan></text>
<text x="40" y="299" fill="#9aa0a6" font-size="12">then given a moment (stepPauseMs, 400ms). Pressed by hand, reboot asks first: a second press within 3s</text>
</svg>
