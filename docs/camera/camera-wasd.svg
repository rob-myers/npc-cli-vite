<text x="430" y="120" fill="#4ec98a" font-size="12" text-anchor="start">Screen-up within 20° of an axis (compassSnapRad):</text>
<text x="430" y="136" fill="#4ec98a" font-size="12" text-anchor="start">the w-key heads along that axis.</text>
<text x="430" y="176" fill="#e0b050" font-size="12" text-anchor="start">Further off: it heads up the screen.</text>
<text x="430" y="216" fill="#9aa0a6" font-size="12" text-anchor="start">Taken as the first move key goes down,</text>
<text x="430" y="232" fill="#9aa0a6" font-size="12" text-anchor="start">kept whilst any is held.</text>
<text x="430" y="272" fill="#9aa0a6" font-size="12" text-anchor="start">Whilst wasd_delta runs, a held key turns</text>
<text x="430" y="288" fill="#9aa0a6" font-size="12" text-anchor="start">the view until just within 20° of the</text>
<text x="430" y="304" fill="#9aa0a6" font-size="12" text-anchor="start">nearest axis, and no further.</text>
