<text x="286.0" y="84" fill="#e0b050" font-size="12" text-anchor="start">let go here: eases to the nearer stop, once input pauses (zoomSettleMs)</text>
<rect x="110" y="236" width="189.0" height="28" fill="#1f2d42" stroke="#5aa0f0"/>
<rect x="299.0" y="236" width="351.0" height="28" fill="#262a31" stroke="#3a404a"/>
<text x="204.5" y="255" fill="#8cc0ff" font-size="13" text-anchor="middle" font-weight="600">pinch: zooms</text>
<text x="474.5" y="255" fill="#e6e6e6" font-size="13" text-anchor="middle">drift: turns</text>
<text x="110" y="284" fill="#9aa0a6" font-size="12" text-anchor="middle">0</text>
<text x="299.0" y="284" fill="#9aa0a6" font-size="12" text-anchor="middle">pinchPurity 0.35</text>
<text x="650" y="284" fill="#9aa0a6" font-size="12" text-anchor="middle">1</text>
<text x="24" y="220" fill="#9aa0a6" font-size="12" text-anchor="start">two fingers: twoFingerRotateRatio, the smoothed share of centroid motion over spread</text>
