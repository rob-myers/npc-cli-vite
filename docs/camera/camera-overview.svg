<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
<defs><marker id="down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8290"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5aa0f0"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ec98a"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0b050"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa0a6"/></marker></defs>
<rect width="760" height="372" rx="10" fill="#1b1d22"/>
<text x="24" y="32" fill="#e6e6e6" font-size="15" font-weight="600">the camera: input, controls, then the World&#x27;s framing</text>
<rect x="60" y="56" width="640" height="58" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="75" fill="#e6e6e6" font-size="13" text-anchor="start" font-weight="600">input</text>
<text x="76" y="92" fill="#9aa0a6" font-size="12" text-anchor="start">mouse and touch drags, the wheel and pinches (onMouseDown, onTouchStart)</text>
<text x="76" y="107" fill="#9aa0a6" font-size="12" text-anchor="start">keys: framing presets, fade mode, wasd</text>
<line x1="380.0" y1="114" x2="380.0" y2="130" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="132" width="640" height="58" rx="8" fill="#1f2d42" stroke="#5aa0f0"/>
<text x="76" y="151" fill="#8cc0ff" font-size="13" text-anchor="start" font-weight="600">CameraControls (service/camera-controls.ts)</text>
<text x="76" y="168" fill="#9aa0a6" font-size="12" text-anchor="start">pans, turns about a pivot, and zooms between two stops</text>
<text x="76" y="183" fill="#9aa0a6" font-size="12" text-anchor="start">a custom MapControls, its props from WorldView&#x27;s ctrlOpts</text>
<line x1="380.0" y1="190" x2="380.0" y2="206" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="208" width="640" height="58" rx="8" fill="#262a31" stroke="#3a404a"/>
<text x="76" y="227" fill="#e6e6e6" font-size="13" text-anchor="start" font-weight="600">WorldView</text>
<text x="76" y="244" fill="#9aa0a6" font-size="12" text-anchor="start">framing: fov and the floor seen at each stop (camera-view.ts)</text>
<text x="76" y="259" fill="#9aa0a6" font-size="12" text-anchor="start">embodied: what may be steered. wasd heading: where the w-key heads</text>
<line x1="380.0" y1="266" x2="380.0" y2="282" stroke="#7a8290" stroke-width="1.5" marker-end="url(#down)"/>
<rect x="60" y="284" width="640" height="58" rx="8" fill="#1f3a2c" stroke="#4ec98a"/>
<text x="76" y="303" fill="#4ec98a" font-size="13" text-anchor="start" font-weight="600">following the player</text>
<text x="76" y="320" fill="#9aa0a6" font-size="12" text-anchor="start">frames the player and their frontier, read off the light sweep</text>
<text x="76" y="335" fill="#9aa0a6" font-size="12" text-anchor="start">a look caps it, a far look extends it</text>
</svg>
