<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8290"/></marker>
</defs>
<style>
  .box { fill: #262a31; stroke: #3a404a; }
  .key { fill: #232831; stroke: #5aa0f0; stroke-width: 1.5; }
  .later { fill: #22252b; stroke: #3a404a; stroke-dasharray: 4 3; }
  .lane { fill: #9aa0a6; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
  .time { fill: #5aa0f0; font-size: 12px; font-weight: 600; }
  .title { fill: #e6e6e6; font-size: 13px; font-weight: 600; }
  .note { fill: #9aa0a6; font-size: 11.5px; }
  .mono { font-family: ui-monospace, monospace; font-size: 11px; }
</style>
<rect width="760" height="590" rx="10" fill="#1b1d22"/>
<text x="20" y="30" fill="#e6e6e6" font-size="15" font-weight="600">From a DEV save to the updated World, e.g. a save to 101</text>

<!-- lane headers and guides -->
<text x="20" y="62" class="lane">TIME</text>
<text x="96" y="62" class="lane">MAPEDIT TAB</text>
<text x="288" y="62" class="lane">DEV SERVER</text>
<text x="530" y="62" class="lane">WORLD TAB</text>
<line x1="282" y1="70" x2="282" y2="574" stroke="#2c3038"/>
<line x1="522" y1="70" x2="522" y2="574" stroke="#2c3038"/>

<!-- 0 ms: save -->
<text x="20" y="100" class="time">0 ms</text>
<rect x="96" y="78" width="176" height="46" rx="8" class="box"/>
<text x="108" y="98" class="title">save</text>
<text x="108" y="114" class="note">POSTs the file</text>
<line x1="272" y1="112" x2="286" y2="142" stroke="#7a8290" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 15 ms: save route -->
<text x="20" y="158" class="time">15 ms</text>
<rect x="288" y="136" width="226" height="46" rx="8" class="box"/>
<text x="300" y="156" class="title">the save route</text>
<text x="300" y="172" class="note">writes, announces, then responds</text>

<!-- 30 ms: watcher -->
<text x="20" y="216" class="time">30 ms</text>
<rect x="288" y="194" width="226" height="46" rx="8" class="box"/>
<text x="300" y="214" class="title">watcher, then genAssetsJson</text>
<text x="300" y="230" class="note">in-process, skipping seen content</text>
<line x1="514" y1="217" x2="528" y2="217" stroke="#7a8290" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="530" y="194" width="210" height="46" rx="8" class="box"/>
<text x="542" y="214" class="title"><tspan class="mono" font-size="12">assets</tspan> pending</text>
<text x="542" y="230" class="note mono">assets-json-changing</text>

<!-- 300 ms: written -->
<text x="20" y="274" class="time">~300 ms</text>
<rect x="288" y="252" width="226" height="46" rx="8" class="box"/>
<text x="300" y="272" class="title">assets written</text>
<text x="300" y="288" class="note">~280 ms, kept layouts reused</text>
<line x1="514" y1="275" x2="528" y2="275" stroke="#7a8290" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="530" y="252" width="210" height="46" rx="8" class="box"/>
<text x="542" y="272" class="title">World query</text>
<text x="542" y="288" class="note mono">assets-json-changed</text>

<!-- 430 ms: query done -->
<text x="20" y="332" class="time">~430 ms</text>
<rect x="530" y="310" width="210" height="46" rx="8" class="box"/>
<text x="542" y="330" class="title">new gms, hashes</text>
<text x="542" y="346" class="note">room ids drawn and queued</text>

<!-- 450 ms: one commit -->
<text x="20" y="390" class="time">~450 ms</text>
<rect x="530" y="368" width="210" height="46" rx="8" class="key"/>
<text x="542" y="388" class="title">one commit</text>
<text x="542" y="404" class="note">room ids, fade, every layer, decor</text>

<!-- 600 ms: navmesh -->
<text x="20" y="448" class="time">~600 ms</text>
<rect x="530" y="426" width="210" height="46" rx="8" class="later"/>
<text x="542" y="446" class="title">navmesh, physics</text>
<text x="542" y="462" class="note">floor mesh lines, decor colliders</text>

<!-- 1 s: thumbnail -->
<text x="20" y="506" class="time">~1 s</text>
<rect x="288" y="484" width="226" height="46" rx="8" class="later"/>
<text x="300" y="504" class="title">the save's thumbnail</text>
<text x="300" y="520" class="note">drawn 1 s after the save</text>
<line x1="288" y1="507" x2="274" y2="507" stroke="#7a8290" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="96" y="484" width="176" height="46" rx="8" class="later"/>
<text x="108" y="504" class="title">thumbnails refetched</text>
<text x="108" y="520" class="note mono">map-edit:thumbnail-saved</text>

<!-- 4 s: spots -->
<text x="20" y="564" class="time">~4 s</text>
<rect x="288" y="542" width="226" height="40" rx="8" class="later"/>
<text x="300" y="566" class="title">gen-spots, a child process</text>
<line x1="514" y1="562" x2="528" y2="562" stroke="#7a8290" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="530" y="542" width="210" height="40" rx="8" class="later"/>
<text x="542" y="566" class="title">spots arrive</text>
</svg>
