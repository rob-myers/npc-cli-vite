<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8290"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="10" fill="#1b1d22"/>
  <text x="24" y="32" fill="#e6e6e6" font-size="15" font-weight="600">161 npcs talking: a line said renders its own bubble alone</text>

  <!-- before -->
  <rect x="24" y="50" width="440" height="180" rx="8" fill="#262a31" stroke="#3a404a"/>
  <text x="40" y="74" fill="#f87171" font-weight="600">before: every bubble re-ran its ref</text>
  <rect x="40" y="90" width="90" height="26" rx="12" fill="#000" stroke="#f87171"/>
  <text x="52" y="108" fill="#f2f2f2">a new line</text>
  <path d="M132,103 L168,103" stroke="#7a8290" marker-end="url(#next)"/>
  <g fill="#000" stroke="#555">
    <rect x="172" y="88" width="40" height="18" rx="8"/><rect x="216" y="88" width="40" height="18" rx="8"/>
    <rect x="260" y="88" width="40" height="18" rx="8"/><rect x="304" y="88" width="40" height="18" rx="8"/>
    <rect x="172" y="110" width="40" height="18" rx="8"/><rect x="216" y="110" width="40" height="18" rx="8"/>
    <rect x="260" y="110" width="40" height="18" rx="8"/><rect x="304" y="110" width="40" height="18" rx="8"/>
  </g>
  <text x="352" y="112" fill="#9aa0a6" font-size="12">… 161 of them</text>
  <g fill="#9aa0a6" font-size="12">
    <text x="40" y="152">each re-renders, and its ref places and fades every bubble:</text>
    <text x="40" y="168">161 × 161 placings a line</text>
    <text x="40" y="196" fill="#f87171">20 lines a second: 43fps, 112 frames in 8s over 20ms</text>
  </g>

  <!-- after -->
  <rect x="496" y="50" width="440" height="180" rx="8" fill="#262a31" stroke="#3a404a"/>
  <text x="512" y="74" fill="#cde8d4" font-weight="600">after: memoised NpcBubble, stable refs</text>
  <rect x="512" y="90" width="90" height="26" rx="12" fill="#000" stroke="#3f7a52"/>
  <text x="524" y="108" fill="#f2f2f2">a new line</text>
  <path d="M604,103 L640,103" stroke="#7a8290" marker-end="url(#next)"/>
  <rect x="644" y="88" width="40" height="18" rx="8" fill="#000" stroke="#3f7a52"/>
  <g fill="#000" stroke="#3a404a" opacity="0.6">
    <rect x="688" y="88" width="40" height="18" rx="8"/><rect x="732" y="88" width="40" height="18" rx="8"/>
    <rect x="776" y="88" width="40" height="18" rx="8"/><rect x="644" y="110" width="40" height="18" rx="8"/>
    <rect x="688" y="110" width="40" height="18" rx="8"/><rect x="732" y="110" width="40" height="18" rx="8"/>
    <rect x="776" y="110" width="40" height="18" rx="8"/>
  </g>
  <text x="824" y="112" fill="#9aa0a6" font-size="12">untouched</text>
  <g fill="#9aa0a6" font-size="12">
    <text x="512" y="152">only its bubble renders, and it places itself:</text>
    <text x="512" y="168">place(npcKey), syncRoomFades(npcKey)</text>
    <text x="512" y="196" fill="#cde8d4">20 lines a second: 60fps, 2 frames in 8s over 20ms</text>
  </g>

  <!-- per frame, per line -->
  <text x="24" y="264" fill="#e6e6e6" font-weight="600">each frame</text>
  <g fill="#9aa0a6" font-size="12">
    <text x="24" y="284">an idle npc: one early return (tickHead)</text>
    <text x="24" y="300">a speaker: head turns, two talk_left tracks, their bubble placed</text>
    <text x="24" y="316">words lit and pages turned by writing to the DOM, never a render</text>
  </g>
  <text x="496" y="264" fill="#e6e6e6" font-weight="600">each line</text>
  <g fill="#9aa0a6" font-size="12">
    <text x="496" y="284">a game-time timer per chunk, and an earshot test as each starts</text>
    <text x="496" y="300">one speech-heard, however many heard it: { id, npcKey, heard }</text>
    <text x="496" y="316">161 lines begun in one tick: one 60 to 180ms frame, mounting them</text>
  </g>
  <text x="24" y="372" fill="#5aa0f0" font-size="12">measured with 161 npcs in a DEV World, from an MCP query: frame times over 8s runs</text>
</svg>
