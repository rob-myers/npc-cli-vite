<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8290"/>
    </marker>
    <marker id="yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d8b46a"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="10" fill="#1b1d22"/>
  <text x="24" y="32" fill="#e6e6e6" font-size="15" font-weight="600">comms: a reply's needs, tested whilst its replies are shown</text>

  <g>
    <rect x="30" y="52" width="168" height="150" rx="8" fill="#262a31" stroke="#3a404a"/>
    <text x="44" y="74" fill="#e6e6e6" font-weight="600">1  comms</text>
    <g fill="#9aa0a6" font-size="12">
      <text x="44" y="96">names each need</text>
      <text x="44" y="112">(defineNeeds):</text>
      <text x="44" y="132" fill="#e6e6e6" font-family="ui-monospace, Menlo, monospace" font-size="11">near facing psi sees</text>
      <text x="44" y="152">Idempotent, in the</text>
      <text x="44" y="168">default profile</text>
    </g>
    <text x="44" y="190" fill="#5aa0f0" font-size="12">comms off: all gone</text>

    <rect x="213" y="52" width="168" height="150" rx="8" fill="#262a31" stroke="#3a404a"/>
    <text x="227" y="74" fill="#e6e6e6" font-weight="600">2  when</text>
    <g fill="#9aa0a6" font-size="12">
      <text x="227" y="96">a keyed tick, every</text>
      <text x="227" y="112">everySecs (0.2s),</text>
      <text x="227" y="128">and at once on</text>
      <text x="227" y="144">talk-ask. Only talks</text>
      <text x="227" y="160">with replies open</text>
    </g>
    <text x="227" y="190" fill="#5aa0f0" font-size="12">test(w, threadKeys)</text>

    <rect x="396" y="52" width="168" height="150" rx="8" fill="#262a31" stroke="#3a404a"/>
    <text x="410" y="74" fill="#e6e6e6" font-weight="600">3  met</text>
    <g fill="#9aa0a6" font-size="12">
      <text x="410" y="96">between the one asked</text>
      <text x="410" y="112">and the asker:</text>
      <text x="410" y="132"><tspan fill="#e6e6e6">near</tspan> within 1.6m</text>
      <text x="410" y="148"><tspan fill="#e6e6e6">facing</tspan> within 36°</text>
      <text x="410" y="164"><tspan fill="#e6e6e6">psi</tspan> raised</text>
    </g>
    <text x="410" y="190" fill="#5aa0f0" font-size="12">commsNeeds[k].met</text>

    <rect x="579" y="52" width="168" height="150" rx="8" fill="#262a31" stroke="#3a404a" stroke-dasharray="5 4"/>
    <text x="593" y="74" fill="#e6e6e6" font-weight="600">4  the worker</text>
    <g fill="#9aa0a6" font-size="12">
      <text x="593" y="96"><tspan fill="#e6e6e6">sees</tspan> asks the nav</text>
      <text x="593" y="112">worker too. All such</text>
      <text x="593" y="128">queries go in one</text>
      <text x="593" y="144">batch, one batch at</text>
      <text x="593" y="160">a time</text>
    </g>
    <text x="593" y="190" fill="#5aa0f0" font-size="12">spotQueryDetached</text>

    <rect x="762" y="52" width="168" height="150" rx="8" fill="#262a31" stroke="#3a404a"/>
    <text x="776" y="74" fill="#e6e6e6" font-weight="600">5  pips</text>
    <g fill="#9aa0a6" font-size="12">
      <text x="776" y="96">setMet, by thread:</text>
      <text x="776" y="112">only a change</text>
      <text x="776" y="128">re-renders. A pip is</text>
      <text x="776" y="144">green once met. All</text>
      <text x="776" y="160">green, it is clickable</text>
    </g>
    <text x="776" y="190" fill="#5aa0f0" font-size="12">w.speech.needsMet</text>
  </g>
  <g stroke="#7a8290" stroke-width="1.5" marker-end="url(#next)">
    <line x1="198" y1="127" x2="211" y2="127"/>
    <line x1="381" y1="127" x2="394" y2="127"/>
    <line x1="564" y1="127" x2="577" y2="127"/>
    <line x1="747" y1="127" x2="760" y2="127"/>
  </g>
  <path d="M480,202 L480,226 L846,226 L846,205" fill="none" stroke="#d8b46a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#yellow)"/>
  <text x="663" y="244" fill="#d8b46a" font-size="12" text-anchor="middle">no query needed: straight to setMet</text>

  <rect x="30" y="270" width="900" height="104" rx="8" fill="#262a31" stroke="#3a404a"/>
  <text x="48" y="294" fill="#e6e6e6" font-weight="600">cleared, not tested</text>
  <g fill="#9aa0a6" font-size="12">
    <text x="48" y="318">A thread's pips are cleared whilst its replies are not shown: the comms tab shut, the thread folded, or the player not the one asked.</text>
    <text x="48" y="338">An answer that comes back after its talk changed, e.g. replied to or asked again, is dropped.</text>
    <text x="48" y="358">Threads asked for during a batch wait for it, then are tested together.</text>
  </g>
</svg>
