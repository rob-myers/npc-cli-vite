<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8290"/>
    </marker>
    <marker id="yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d8b46a"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="10" fill="#1b1d22"/>
  <text x="24" y="32" fill="#e6e6e6" font-size="15" font-weight="600">a talk: jsh says the lines, a listener chooses what follows</text>

  <!-- the five steps -->
  <g>
    <rect x="30" y="52" width="168" height="136" rx="8" fill="#262a31" stroke="#3a404a"/>
    <text x="44" y="74" fill="#e6e6e6" font-weight="600">1  ask</text>
    <g fill="#9aa0a6" font-size="11" font-family="ui-monospace, Menlo, monospace" xml:space="preserve">
      <text x="44" y="96">ask "Who goes there?"</text>
      <text x="44" y="112">  <tspan fill="#d8b46a">with:abe</tspan></text>
      <text x="44" y="128">  friend:"A friend"</text>
      <text x="44" y="144">  foe:"[near] …"</text>
    </g>
    <text x="44" y="176" fill="#5aa0f0" font-size="12">emits talk-ask</text>

    <rect x="213" y="52" width="168" height="136" rx="8" fill="#262a31" stroke="#3a404a"/>
    <text x="227" y="74" fill="#e6e6e6" font-weight="600">2  held</text>
    <g fill="#9aa0a6" font-size="12">
      <text x="227" y="96">abe's line stays over</text>
      <text x="227" y="112">their head until it is</text>
      <text x="227" y="128">answered. Its replies</text>
      <text x="227" y="144">show under the thread,</text>
      <text x="227" y="160">with pips for needs</text>
    </g>
    <text x="227" y="176" fill="#5aa0f0" font-size="12">w.speech.talks</text>

    <rect x="396" y="52" width="168" height="136" rx="8" fill="#262a31" stroke="#3a404a"/>
    <text x="410" y="74" fill="#e6e6e6" font-weight="600">3  answered</text>
    <g fill="#9aa0a6" font-size="12">
      <text x="410" y="96">the player clicks one,</text>
      <text x="410" y="112">said once its needs</text>
      <text x="410" y="128">pass. Or jsh says it:</text>
    </g>
    <text x="410" y="148" fill="#9aa0a6" font-size="11" font-family="ui-monospace, Menlo, monospace">reply friend npc:abe</text>
    <text x="410" y="176" fill="#5aa0f0" font-size="12">emits talk-reply</text>

    <rect x="579" y="52" width="168" height="136" rx="8" fill="#262a31" stroke="#3a404a"/>
    <text x="593" y="74" fill="#e6e6e6" font-weight="600">4  a listener</text>
    <g fill="#9aa0a6" font-size="12">
      <text x="593" y="96">whatever listens to</text>
      <text x="593" y="112">talk-reply decides</text>
      <text x="593" y="128">what follows, e.g.</text>
      <text x="593" y="144">jsh events, or a</text>
      <text x="593" y="160">keyed listener</text>
    </g>
    <text x="593" y="176" fill="#5aa0f0" font-size="12">nothing waits</text>

    <rect x="762" y="52" width="168" height="136" rx="8" fill="#262a31" stroke="#3a404a"/>
    <text x="776" y="74" fill="#e6e6e6" font-weight="600">5  next</text>
    <g fill="#9aa0a6" font-size="12">
      <text x="776" y="96"><tspan fill="#e6e6e6">ask</tspan> asks again</text>
      <text x="776" y="116"><tspan fill="#e6e6e6">tell</tspan> says a line, and</text>
      <text x="776" y="132">closes open replies</text>
      <text x="776" y="152"><tspan fill="#e6e6e6">bye</tspan> leaves "the end"</text>
    </g>
    <text x="776" y="176" fill="#5aa0f0" font-size="12">talk-tell, talk-bye</text>
  </g>
  <g stroke="#7a8290" stroke-width="1.5" marker-end="url(#next)">
    <line x1="198" y1="120" x2="211" y2="120"/>
    <line x1="381" y1="120" x2="394" y2="120"/>
    <line x1="564" y1="120" x2="577" y2="120"/>
    <line x1="747" y1="120" x2="760" y2="120"/>
  </g>
  <path d="M846,188 L846,212 L297,212 L297,191" fill="none" stroke="#d8b46a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#yellow)"/>
  <text x="571" y="230" fill="#d8b46a" font-size="12" text-anchor="middle">ask again</text>

  <!-- in the comms tab -->
  <rect x="30" y="256" width="430" height="190" rx="8" fill="#262a31" stroke="#3a404a"/>
  <text x="48" y="280" fill="#7a8290" font-size="12">in the comms tab, at step 2</text>
  <text x="48" y="304" fill="#9aa0a6" font-size="12">⌄ abe · rob</text>
  <rect x="48" y="316" width="140" height="28" rx="14" fill="#1b1d22" stroke="#3a404a"/>
  <text x="62" y="334" fill="#e6e6e6" font-size="12">Who goes there?</text>
  <text x="200" y="334" fill="#7a8290" font-size="11">also held over abe's head</text>
  <rect x="320" y="356" width="120" height="26" rx="13" fill="none" stroke="#71717a" stroke-dasharray="3 3"/>
  <text x="334" y="373" fill="#e6e6e6" font-size="12">1  A friend</text>
  <rect x="294" y="390" width="146" height="26" rx="13" fill="none" stroke="#71717a" stroke-dasharray="3 3"/>
  <text x="308" y="407" fill="#e6e6e6" font-size="12">2  Step aside</text>
  <rect x="414" y="400" width="11" height="6" rx="2" fill="none" stroke="#71717a"/>
  <text x="440" y="434" fill="#7a8290" font-size="11" text-anchor="end">a pip: it needs near, tested when pressed</text>

  <!-- the events -->
  <rect x="480" y="256" width="450" height="190" rx="8" fill="#262a31" stroke="#3a404a"/>
  <text x="498" y="280" fill="#7a8290" font-size="12">the events, in order</text>
  <g fill="#9aa0a6" font-size="11" font-family="ui-monospace, Menlo, monospace" xml:space="preserve">
    <text x="498" y="308">{ key: <tspan fill="#5aa0f0">"talk-ask"</tspan>, npcKey: "abe", to: "rob",</text>
    <text x="498" y="324">  text: "Who goes there?", replies: ["friend", "foe"] }</text>
    <text x="498" y="352">{ key: <tspan fill="#5aa0f0">"talk-reply"</tspan>, npcKey: "rob", to: "abe",</text>
    <text x="498" y="368">  choice: "friend" }</text>
    <text x="498" y="396">{ key: <tspan fill="#5aa0f0">"talk-tell"</tspan>, npcKey: "abe", to: "rob", text: … }</text>
    <text x="498" y="424">{ key: <tspan fill="#5aa0f0">"talk-bye"</tspan>, npcKey: "abe", to: "rob" }</text>
  </g>
</svg>
