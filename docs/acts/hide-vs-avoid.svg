  <line x1="300" y1="150" x2="300" y2="200" stroke="#d8b46a" stroke-width="3"/>
  <line x1="500" y1="210" x2="500" y2="250" stroke="#1b1d22" stroke-width="5"/>
  <line x1="500" y1="210" x2="500" y2="250" stroke="#d8b46a" stroke-width="3"/>
  <text x="52" y="80" fill="#9aa0a6" font-size="12">room A</text>
  <text x="312" y="80" fill="#9aa0a6" font-size="12">room B</text>
  <text x="512" y="80" fill="#9aa0a6" font-size="12">room C</text>
  <path d="M118,175 L430,175" fill="none" stroke="#e06c6c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="110" cy="175" r="14" fill="#1f2d42" stroke="#5aa0f0" stroke-width="1.5"/>
  <text x="110" y="179" fill="#8cc0ff" font-size="11" text-anchor="middle" font-weight="600">rob</text>
  <circle cx="200" cy="245" r="14" fill="#262a31" stroke="#3a404a" stroke-width="1.5"/>
  <text x="200" y="249" fill="#e6e6e6" font-size="11" text-anchor="middle" font-weight="600">kate</text>
  <circle cx="430" cy="175" r="9" fill="#2a2618" stroke="#d8b46a" stroke-width="2"/>
  <circle cx="650" cy="120" r="9" fill="#1f3a2c" stroke="#4ec98a" stroke-width="2"/>
  <path d="M214,238 L300,185 L418,178" fill="none" stroke="#d8b46a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#yellow)"/>
