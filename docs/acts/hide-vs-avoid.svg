  <text x="380" y="205" fill="#e8c880" font-size="12" font-weight="600">avoid</text>
  <text x="612" y="178" fill="#4ec98a" font-size="12" font-weight="600">hide</text>
  <rect x="40" y="290" width="330" height="24" rx="12" fill="#2a2618" stroke="#d8b46a"/>
  <text x="52" y="306" fill="#e8c880" font-size="12">avoid: unseen as the doors stand</text>
  <rect x="390" y="290" width="330" height="24" rx="12" fill="#1f3a2c" stroke="#4ec98a"/>
  <text x="402" y="306" fill="#4ec98a" font-size="12">hide: unseen with its room&#x27;s doors open</text>
  <text x="40" y="340" fill="#9aa0a6" font-size="12">She opens the door going in, so hide judges it open: rob would see into room B.</text>
  <text x="40" y="356" fill="#9aa0a6" font-size="12">Both skip spots others stand at or head for, and want away metres from a watcher who sees.</text>
