<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">
  <style>
    .rung { fill: #262a31; stroke: #3a404a; }
    .last { fill: #2a2326; stroke: #5a3a3e; }
    .num { fill: #5aa0f0; }
    .numText { fill: #1b1d22; font-size: 13px; font-weight: 700; }
    .title { fill: #e6e6e6; font-size: 14px; font-weight: 600; }
    .note { fill: #9aa0a6; font-size: 12px; }
    .else { fill: #7a8290; font-size: 11px; }
  </style>
  <rect width="760" height="452" rx="10" fill="#1b1d22"/>
  <text x="20" y="28" fill="#e6e6e6" font-size="15" font-weight="600">Where a body falls: what fitDeath tries, in order</text>
  <g transform="translate(0 40)">
    <rect x="20" y="0" width="720" height="62" rx="8" class="rung"/>
    <circle cx="48" cy="31" r="13" class="num"/><text x="48" y="35" text-anchor="middle" class="numText">1</text>
    <text x="74" y="24" class="title">A clear fall where they stand</text>
    <text x="74" y="44" class="note">Along the shot (± fallJitter), then each of fitTurns, then the other way. Clear of walls, people and corpses.</text>
    <text x="34" y="80" class="else">else ↓</text>
    <rect x="20" y="88" width="720" height="62" rx="8" class="rung"/>
    <circle cx="48" cy="119" r="13" class="num"/><text x="48" y="123" text-anchor="middle" class="numText">2</text>
    <text x="74" y="112" class="title">A stagger spot along the shot</text>
    <text x="74" y="132" class="note">staggerBy away, ±45°, with no one on the way. Behind them: walk back first. Ahead: the fall slides them there.</text>
    <text x="34" y="168" class="else">else ↓</text>
    <rect x="20" y="176" width="720" height="62" rx="8" class="rung"/>
    <circle cx="48" cy="207" r="13" class="num"/><text x="48" y="211" text-anchor="middle" class="numText">3</text>
    <text x="74" y="200" class="title">Clear of corpses only</text>
    <text x="74" y="220" class="note">The living in its strip make way (makeWayFor), to the nearer side, the player too.</text>
    <text x="34" y="256" class="else">else ↓</text>
    <rect x="20" y="264" width="720" height="62" rx="8" class="rung"/>
    <circle cx="48" cy="295" r="13" class="num"/><text x="48" y="299" text-anchor="middle" class="numText">4</text>
    <text x="74" y="288" class="title">Clear of walls alone</text>
    <text x="74" y="308" class="note">Onto whoever is there. A body never shows through a wall or a shut door.</text>
    <text x="34" y="344" class="else">else ↓</text>
    <rect x="20" y="352" width="720" height="40" rx="8" class="last"/>
    <circle cx="48" cy="372" r="13" class="num"/><text x="48" y="376" text-anchor="middle" class="numText">5</text>
    <text x="74" y="377" class="title">Collapse where they stand (hitConfig.sink): no corpse body, no fall sound</text>
  </g>
</svg>
